[package]
name = "wallet-core"
version = "0.0.0"
description = "Hardware-independent wallet logic: transaction reading and the fork's unified signature hash."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# SHA-256 only. No default features: no std and no heap. bitcoin_hashes has no
# build script of its own. Its dependency bitcoin-internals does (the lock file
# holds versions 0.6.0 and 0.7.0, each with the same one): it runs
# `rustc --version` on the build machine and writes one generated macro file.
bitcoin_hashes = { version = "1.2.0", default-features = false }

[lints]
workspace = true
