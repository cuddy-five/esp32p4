# Who must approve what, and when.
#
# Agents prepare and check work; the human decides every merge. As risk
# rises, the human is brought in earlier. The CLI evaluates these declarations;
# the manual team process must uphold them until an executor exists.
#
# Risk levels must equal contracts/common.schema.json#/$defs/risk_level.
# Stages are points in orchestration/state-machine.yaml where a transition
# consults this policy via approval_required / approval_not_required; a human's
# decision is checked by approval_granted.
# tests/unit/orchestration.test.js validates the shape and the enums.

version: 1

stages:
  plan:
    description: Before planning -> in_progress. The human reads the plan and the plan review.
  merge:
    description: After verifying -> awaiting_approval, before the human moves to done. The human reads the result-to-be, the reviews, and the verifier's evidence.
  step:
    description: Before each plan step whose kind or files match a sensitive rule. Reserved; not yet enforced.

# Approval requirements by task.risk.level. Each entry lists the stages where
# a human approval is required and the minimum review coverage the loop must
# produce before the task may even reach that stage.
by_risk:
  low:
    human_stages: [merge]
    required_reviews: [code, verification]
    security_review: optional
    note: Agents may prepare ordinary changes; the overseer decides whether to merge.
  medium:
    human_stages: [merge]
    required_reviews: [code, security, verification]
    security_review: required
  high:
    human_stages: [plan, merge]
    required_reviews: [code, security, verification]
    security_review: required
  critical:
    human_stages: [plan, merge, step]
    required_reviews: [code, security, verification]
    security_review: required
    note: Critical tasks also require a second human approver when more than one overseer is configured.

# Independent of risk level, touching any of these paths or carrying any of
# these risk tags forces the listed stages to require a human. Globs are
# repository-relative and evaluated against evidence.diff.paths.
always_human:
  - id: control_plane_self
    paths: [".github/control-plane/**", ".github/workflows/**", ".github/actions/**", ".github/hooks/**", "scripts/hooks/**", ".review-domains.json", ".gitattributes"]
    stages: [plan, merge]
    reason: Changes to the guardrails, agent hooks, review coverage or diff visibility are the highest-leverage attack surface.
  - id: instructions_and_ownership
    paths: ["AGENTS.md", "**/AGENTS.md", "CLAUDE.md", "**/CLAUDE.md", "PROJECT.md", "GLOSSARY.md", ".github/copilot-instructions.md", ".github/instructions/**", ".github/agents/**", ".github/skills/**", ".github/prompts/**", ".github/CODEOWNERS", ".agents.registry.json", ".skills.registry.json", ".workflows.registry.json", "docs/decisions/**", "docs/runbooks/agent-team.md", "docs/runbooks/overseer.md", "docs/templates/project-brief.md"]
    stages: [plan, merge]
    reason: Changes to agent instructions, prompts and their tools, recorded decisions, project constraints, or review ownership can redirect the team.
  - id: secrets_and_auth
    tags: [secrets, auth, pii]
    stages: [plan, merge]
  - id: ci_infrastructure_and_spending
    tags: [ci_cd, infra, billing]
    stages: [plan, merge]
    reason: CI, infrastructure and billing changes affect every later task and can spend money (ADR 0003 authorizes no extra paid usage).
  - id: supply_chain
    tags: [dependencies]
    paths: ["package.json", "**/package.json", "package-lock.json", "**/package-lock.json", "pnpm-lock.yaml", "**/pnpm-lock.yaml", "yarn.lock", "**/yarn.lock", "requirements*.txt", "**/requirements*.txt", "poetry.lock", "**/poetry.lock", "go.sum", "**/go.sum", "Cargo.toml", "**/Cargo.toml", "Cargo.lock", "**/Cargo.lock", "build.rs", "**/build.rs", ".cargo/config.toml", "**/.cargo/config.toml", "rust-toolchain.toml", "**/rust-toolchain.toml", "Gemfile.lock", "**/Gemfile.lock"]
    stages: [merge]
    reason: New or changed dependencies and build-time code are reviewed by a human even on low-risk tasks.
  - id: destructive_migration
    tags: [data_migration]
    stages: [plan, merge]
  - id: release
    paths: [".github/workflows/release*.yml", "CHANGELOG.md"]
    stages: [merge]

# Properties of an approval that make it valid for approval_granted.
approval:
  must_reference: [task_id, plan_id, stage]
  must_be_from: human
  expires_after_hours: 72
  invalidated_by:
    - a superseding plan for the same task
    - a new head SHA after a merge-stage approval
    - an open escalation of severity high or critical
  # The approval itself is the original platform record (a PR review or comment by
  # the configured overseer). Contracts only reference it: an agent-written annotation,
  # granted_by, or producer.kind human is a claim, never proof (docs/architecture/agent-memory.md).
  record_as: a reference to the original human record, cited from plan.approvals_required[] with stage, reference URL, approver and timestamp

# What the overseer may do without an approval request being pending.
overseer_powers:
  - halt any task at any time; moves it to blocked with an escalation of reason other and status acknowledged
  - cancel any task at any time
  - request a re-plan from awaiting_approval with free-text feedback
  - raise the risk level of any task; the loop re-evaluates stages immediately
  - ask any role to re-explain its last document; the role replies by updating overseer_note, never by changing the decision
