# Role-scoped tool and MCP access for the agent profiles in .github/agents/.
# This document is not consumed or enforced by the agent runtime: shell access
# can write files even if an edit tool is excluded, so do not treat these
# declarations as isolation. `control-plane policy check`, which CI runs, does
# fail when a profile lists a tool its role does not allow, has no model pin,
# or breaks the model rules below.

version: 1

# The role each profile plays. A profile missing here fails the check.
profiles:
  coordinator: coordinator
  planner: planner
  implementer: implementer
  rust-coder: implementer
  reviewer: reviewer
  security-auditor: security_auditor
  verifier: verifier
  custom-agent-foundry: foundry

# ADR 0003: security-critical review needs a different model family than its
# author. Review roles also set `model-policy: required`.
models:
  coding_roles: [implementer]
  review_roles: [reviewer, security_auditor, verifier]

default_agent:
  excluded_tools:
    - edit
    - execute

roles:
  coordinator:
    allowed_tools:
      - read
      - search
      - execute
      - github/*
      - agent
      - todo
      - basic-memory/search_notes
      - basic-memory/read_note
      - basic-memory/build_context
      - basic-memory/recent_activity
      - basic-memory/read_content
      - basic-memory/list_directory
      - basic-memory/write_note
      - basic-memory/edit_note
    forbidden_tools:
      - edit
      - basic-memory/delete_note
      - basic-memory/move_note
      - basic-memory/create_memory_project
      - basic-memory/delete_project
    mcp_servers: [github, safeoutputs, basic-memory]

  planner:
    allowed_tools:
      - search
      - read
      - web
      - github/*
      - context7/*
      - edit
      - execute # Shell access is not a write restriction.
      - lsp # Navigation only; the profile forbids rename.
      - todo
      - notebooklm/notebook_list
      - notebooklm/notebook_get
      - notebooklm/notebook_describe
      - notebooklm/source_describe
      - notebooklm/source_get_content
      - notebooklm/notebook_query
      - notebooklm/notebook_query_start
      - notebooklm/notebook_query_status
      - notebooklm/cross_notebook_query
      - basic-memory/search_notes
      - basic-memory/read_note
      - basic-memory/build_context
      - basic-memory/recent_activity
      - basic-memory/read_content
      - basic-memory/list_directory
    forbidden_tools: # Read tools only; shared notes are written by the coordinator.
      - basic-memory/write_note
      - basic-memory/edit_note
      - basic-memory/delete_note
      - basic-memory/move_note
      - basic-memory/create_memory_project
      - basic-memory/delete_project
    mcp_servers: [github, context7, basic-memory, notebooklm]

  implementer:
    allowed_tools:
      - read
      - edit
      - search
      - execute
      - context7/*
      - lsp # rust-coder: rust-analyzer from .github/lsp.json, not an MCP server.
      - todo
      - web # rust-coder only: vendor documentation.
      - github/* # rust-coder only: read tools; the GitHub server is read-only by default.
      - notebooklm/notebook_list # The NotebookLM entries apply to rust-coder only.
      - notebooklm/notebook_get
      - notebooklm/notebook_describe
      - notebooklm/source_describe
      - notebooklm/source_get_content
      - notebooklm/notebook_query
      - notebooklm/notebook_query_start
      - notebooklm/notebook_query_status
      - notebooklm/cross_notebook_query
    forbidden_tools: []
    mcp_servers: [github, context7, notebooklm]

  reviewer:
    allowed_tools:
      - read
      - search
      - execute # Inspection only; requires client controls for enforced read-only access.
      - lsp # Navigation only; the profile forbids rename.
    forbidden_tools:
      - edit
    mcp_servers: []

  security_auditor:
    allowed_tools:
      - read
      - search
      - execute # Intended for scans; shell can also write files.
      - lsp # Navigation only; the profile forbids rename.
      - github/*
      - context7/*
      - notebooklm/notebook_list
      - notebooklm/notebook_get
      - notebooklm/notebook_describe
      - notebooklm/source_describe
      - notebooklm/source_get_content
      - notebooklm/notebook_query
      - notebooklm/notebook_query_start
      - notebooklm/notebook_query_status
      - notebooklm/cross_notebook_query
    forbidden_tools:
      - edit
    mcp_servers: [github, context7, notebooklm]

  verifier:
    allowed_tools:
      - read
      - search
      - execute
      - github/*
    forbidden_tools:
      - edit
    mcp_servers: [github]

  foundry: # custom-agent-foundry, the meta-agent that writes agent profiles.
    allowed_tools:
      - read
      - search
      - edit
      - execute
      - web
      - agent
      - github/*
      - context7/*
      - todo
    forbidden_tools: []
    mcp_servers: [github, context7]
