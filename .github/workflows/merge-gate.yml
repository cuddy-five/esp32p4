name: merge-gate

# Informational only. Success means the report ran, not that admission,
# reviews, human approval, or merge permission were established.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      task-file:
        description: Optional untrusted task declaration path
        type: string
        default: ""
      base-ref:
        description: Base ref for manual comparison
        type: string
        default: "origin/main"
      head-ref:
        description: Head ref for manual comparison
        type: string
        default: "HEAD"

permissions:
  contents: read

concurrency:
  group: merge-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission-gate:
    name: admission-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Produce informational comparison
        env:
          CP_EVENT: ${{ github.event_name }}
          CP_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CP_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          CP_BASE_REF: ${{ inputs.base-ref || 'origin/main' }}
          CP_HEAD_REF: ${{ inputs.head-ref || 'HEAD' }}
          CP_TASK_FILE: ${{ inputs.task-file || '' }}
        run: node src/lib/workflow-gate.js
