name: settings-sync

# Reconciles repository settings (labels, rulesets) with the desired state
# declared under .github/control-plane/settings/.
# - Pull requests touching desired state get a plan posted to the step summary.
# - Mutations only happen on manual dispatch with apply=true behind `settings-admin`.

on:
  pull_request:
    paths:
      - ".github/control-plane/settings/**"
      - "src/**"
      - ".github/workflows/settings-sync.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the plan (otherwise plan only)
        type: boolean
        default: false
      only:
        description: Comma-separated resources to include (labels,rulesets). Empty for all.
        type: string
        default: ""
      repo:
        description: Target repository (owner/name). Empty for this repository.
        type: string
        default: ""

permissions:
  contents: read
  issues: read

concurrency:
  group: settings-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    if: ${{ github.event_name == 'pull_request' || inputs.apply != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Plan
        env:
          GH_TOKEN: ${{ github.token }}
          CP_ONLY: ${{ inputs.only }}
          CP_REPO: ${{ inputs.repo }}
        run: |
          args=(--summary)
          [ -n "$CP_ONLY" ] && args+=(--only "$CP_ONLY")
          [ -n "$CP_REPO" ] && args+=(--repo "$CP_REPO")
          node src/cli.js settings plan "${args[@]}"

  apply:
    name: apply
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: settings-admin
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Apply
        env:
          GH_TOKEN: ${{ secrets.CONTROL_PLANE_TOKEN || github.token }}
          CP_ONLY: ${{ inputs.only }}
          CP_REPO: ${{ inputs.repo }}
        run: |
          args=(--yes --summary)
          [ -n "$CP_ONLY" ] && args+=(--only "$CP_ONLY")
          [ -n "$CP_REPO" ] && args+=(--repo "$CP_REPO")
          node src/cli.js settings apply "${args[@]}"