name: agent-evals

# Scheduled and manual guardrail audit; dependency and settings checks use network.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-evals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrail-and-registry-audit:
    name: guardrail-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run registry lint, policy check, and security suites
        run: |
          npm run test:security
          node --test tests/unit/selection-registry-lint.test.js tests/unit/registry.test.js
          node src/cli.js policy check

      - name: Check repository settings drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          node src/cli.js settings check --summary || status=$?
          if [ "$status" -eq 2 ]; then
            echo "::warning::Settings drift detected during scheduled audit."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi