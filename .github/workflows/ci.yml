name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: State machine and approvals agree with contracts
        run: node src/cli.js policy check

  validate-examples:
    name: validate-examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate contract examples with the composite action
        uses: ./.github/actions/validate-contract
        with:
          files: .github/control-plane/contracts/examples/*.json

  lint-workflows:
    name: lint-workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  settings-check:
    name: settings-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: 
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - name: Report drift
        env:
          GH_TOKEN: ${{ secrets.CONTROL_PLANE_TOKEN || github.token }}
        run: node src/cli.js settings check --summary
