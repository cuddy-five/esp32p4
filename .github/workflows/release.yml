name: release

# Verifies release tags (v*), generates an SPDX Software Bill of Materials (SBOM),
# and signs SLSA build provenance attestations via GitHub OIDC.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or ref to package and verify
        type: string
        default: "main"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-and-attest:
    name: package-sbom-and-attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install and verify all tests and policies
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run validate:examples
          node src/cli.js policy check

      - name: Generate SPDX SBOM and release archive
        id: package
        env:
          CP_REF_NAME: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          out_dir="${RUNNER_TEMP}/release-dist"
          mkdir -p "$out_dir"

          sbom_file="${out_dir}/sbom.spdx.json"
          npm sbom --omit=dev --sbom-format=spdx > "$sbom_file"

          tarball="$(npm pack --pack-destination "$out_dir" | tail -n 1)"
          tarball_path="${out_dir}/${tarball}"
          bash scripts/gates/package-smoke.sh "$tarball_path"

          sha256sum "$tarball_path" "$sbom_file" > "${out_dir}/SHA256SUMS.txt"

          {
            echo "### Release Package & SBOM (\`${CP_REF_NAME}\`)"
            echo
            echo '```text'
            cat "${out_dir}/SHA256SUMS.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "dist-dir=$out_dir"
            echo "tarball-path=$tarball_path"
          } >> "$GITHUB_OUTPUT"

      - name: Attest build provenance with OIDC
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@c07444ef71dc1d06d2c1b3ed69d1a0a77174d3d5 # v2.2.3
        with:
          subject-path: ${{ steps.package.outputs.tarball-path }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: control-plane-release-${{ github.run_id }}
          path: ${{ steps.package.outputs.dist-dir }}/*
          retention-days: 90
          if-no-files-found: error