# Native GitHub update proposals start after this file reaches the default branch.
# Next: CONTRIBUTING.md describes the checks and owner review for each proposal.
# These ecosystems belong to the control-plane template; adapt them when copied.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # repo-status.lock.yml is generated by the gh-aw compiler, which pins
      # this action to its own version. Update it by recompiling, not by hand.
      - dependency-name: "github/gh-aw-actions"
      - dependency-name: "github/gh-aw-actions/*"
  - package-ecosystem: cargo
    directory: "/firmware"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
